{% extends 'base.html' %}{% block content %}<div class="eyebrow">跨店患者识别</div><h1>用唯一编号寻找已有档案</h1><p class="lede">本入口仅返回必要识别信息，不提供跨店批量浏览和临床历史。</p><section class="panel"><form method="get" class="search"><label for="patient_no">完整患者业务编号</label><input name="patient_no" id="patient_no" maxlength="40" required><button type="submit">精确查找</button></form>{% if result %}<p><strong>{{ result.name }}</strong> · 电话末四位 {{ result.phone_suffix }}</p><p class="mono">{{ result.patient_no }}</p><a class="button secondary" href="{% url 'visit_create' %}?patient_no={{ result.patient_no|urlencode }}">继续安排预约</a>{% elif submitted %}<p class="empty">没有匹配的有效档案。</p>{% endif %}</section>{% endblock %}
