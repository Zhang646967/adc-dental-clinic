{% if page_obj.paginator.num_pages > 1 %}<nav class="pagination" aria-label="分页">{% if page_obj.has_previous %}<a href="?page={{ page_obj.previous_page_number }}&state={{ state_filter|urlencode }}&due={{ due_filter|urlencode }}">上一页</a>{% endif %}<span>{{ page_obj.number }} / {{ page_obj.paginator.num_pages }}</span>{% if page_obj.has_next %}<a href="?page={{ page_obj.next_page_number }}&state={{ state_filter|urlencode }}&due={{ due_filter|urlencode }}">下一页</a>{% endif %}</nav>{% endif %}
