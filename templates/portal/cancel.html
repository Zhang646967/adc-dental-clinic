{% extends 'portal/base.html' %}{% load workspace_tags %}{% block content %}<h1>确认取消这一次预约</h1><section class="panel"><h2>{{ visit.public_contact.name }} · {{ visit.dentist.name }}</h2><p>{{ visit.scheduled_start|date:'Y年m月d日 H:i' }}（北京时间）</p><p>取消后保留历史；不会删除其他预约。</p></section><form class="panel form-panel" method="post">{% csrf_token %}{% workspace_token %}{{ form.as_div }}<button class="button" type="submit">确认取消本次预约</button><a class="button secondary" href="{% url 'portal_visit' visit.pk %}">不取消，返回详情</a></form>{% endblock %}
