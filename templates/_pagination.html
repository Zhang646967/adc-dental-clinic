{% if page.has_other_pages %}<nav class="pagination" aria-label="分页">{% if page.has_previous %}<a href="?page={{ page.previous_page_number }}{% if pagination_query %}&amp;{{ pagination_query }}{% else %}&amp;q={{ q|urlencode }}{% endif %}">上一页</a>{% endif %}<span>第 {{ page.number }} / {{ page.paginator.num_pages }} 页</span>{% if page.has_next %}<a href="?page={{ page.next_page_number }}{% if pagination_query %}&amp;{{ pagination_query }}{% else %}&amp;q={{ q|urlencode }}{% endif %}">下一页</a>{% endif %}</nav>{% endif %}
