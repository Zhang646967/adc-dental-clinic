{% extends 'base.html' %}{% block content %}<div class="task-board"><p class="eyebrow">协调任务 · 结果核对</p><h1>需要重新核对任务</h1><section class="panel"><p class="notice">{{ problem }}</p>{% if errors %}<div role="alert">{{ errors }}</div>{% endif %}<p>不自动重新发送；先查询原任务或原出诊。查询失败不等于先前办理失败。</p><div class="task-actions">{% if task_id %}<a class="button" href="{% url 'coordination_task_detail' slot_id task_id %}">重新读取原任务</a>{% endif %}<a class="button secondary" href="{% url 'coordination_task_list' %}{% if slot_id %}?slot={{ slot_id }}&amp;mode=all{% endif %}">查询任务记录</a></div></section></div>{% endblock %}
