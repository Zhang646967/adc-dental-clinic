{% if page_obj %}<nav class="actions" aria-label="分页"><span>第 {{ page_obj.number }} / {{ page_obj.paginator.num_pages }} 页</span>{% if page_obj.has_previous %}<a href="?{{ page_query }}&page={{ page_obj.previous_page_number }}">上一页</a>{% endif %}{% if page_obj.has_next %}<a href="?{{ page_query }}&page={{ page_obj.next_page_number }}">下一页</a>{% endif %}</nav>{% endif %}
