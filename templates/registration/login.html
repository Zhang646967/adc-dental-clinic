{% load workspace_tags %}{% load static %}<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>登录 · ADC</title><link rel="stylesheet" href="{% static 'app.css' %}"><link rel="stylesheet" href="{% static 'experience.css' %}"><script defer src="{% static 'experience.js' %}"></script></head><body class="login-body"><main class="login-card"><div class="eyebrow">ADC / 课程项目</div><h1>登录运营工作台</h1><p class="muted">使用初始化时生成的演示账号。请勿输入真实患者数据。</p>
<button class="button secondary mode-toggle" type="button" aria-pressed="false">大字简明模式</button><form method="post">{% csrf_token %}{% workspace_token %}{{ form.non_field_errors }}{% for field in form %}<div class="field">{{ field.label_tag }}{{ field }}{{ field.errors }}</div>{% endfor %}<input type="hidden" name="next" value="{{ next }}"><button type="submit">登录</button></form><p class="small muted">仅供本地功能验证；此页面不代表系统已完成部署验收。</p><a href="{% url 'portal_login' %}">患者登录入口</a></main></body></html>
