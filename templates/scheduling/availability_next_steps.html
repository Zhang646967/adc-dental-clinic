<section class="panel"><h2>有业务占用时，接下来怎么做？</h2><p>由本店前台先核对调班依据和患者意思，必要时明确暂停新增，再发起协调任务并设置下次跟进期限。原预约与有效邀约继续保留。</p><ol><li>在关联核对中逐条联系患者，按原流程确认改期或取消；正在接诊与已完成记录保留。</li><li>仍有效邀约等待患者决定或期限结束；到期后在本店候补另行回收。</li><li>无阻断后提交另一账号主管复核；前台再返回原出诊办理维护。查询和复核不会自动搬移预约。</li></ol><div class="actions"><a class="button secondary" href="{% url 'front_coordination_detail' slot.id %}">核对关联预约与邀约</a><a class="button secondary" href="{% url 'coordination_task_open' slot.id %}">发起调班协调</a><a class="button secondary" href="{% url 'waitlist' %}">查看本店候补</a></div></section>
