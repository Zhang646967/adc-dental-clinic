{% load static %}<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>{% block title %}ADC 口腔 · 服务与就诊{% endblock %}</title><link rel="stylesheet" href="{% static 'service_catalogue.css' %}"><script defer src="{% static 'experience.js' %}"></script></head>
<body class="care-site"><a class="care-skip" href="#main">跳到主要内容</a>
<header class="care-header"><a class="care-brand" href="{% url 'public_home' %}"><span class="care-mark" aria-hidden="true">A</span><span>ADC 口腔<small>DENTAL CARE</small></span></a><nav aria-label="网站导航"><a href="{% url 'public_services' %}">诊疗服务</a><a href="{% url 'public_clinics' %}">门店与到诊</a><a href="{% url 'portal_home' %}">我的预约</a></nav><a class="care-button care-small" href="{% if signed_in %}{% url 'dashboard' %}{% else %}{% url 'portal_login' %}{% endif %}">{% if signed_in %}进入我的账户{% else %}患者登录{% endif %} <span aria-hidden="true">↗</span></a></header>
<main id="main" tabindex="-1" class="care-main">{% block content %}{% endblock %}</main>
<footer class="care-footer"><a class="care-brand" href="{% url 'public_home' %}">ADC 口腔</a><p>了解服务，再安排就诊。预约时间以北京时间（UTC+8）显示。</p><div><button class="care-display-toggle mode-toggle" type="button" aria-pressed="false" hidden>大字简明模式</button>{% if environment_label %}<span class="care-environment">{{ environment_label }}</span>{% endif %}<a href="{% url 'login' %}">员工工作台</a></div></footer></body></html>
