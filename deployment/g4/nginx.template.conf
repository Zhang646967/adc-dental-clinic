# Single-host direct HTTPS ingress; actual certificate and DNS still required.
server_names_hash_bucket_size 512;
limit_req_zone $binary_remote_addr zone=adc_general:10m rate=5r/s;
limit_req_zone $binary_remote_addr zone=adc_login:10m rate=10r/m;
log_format adc_minimal '$request_method $status $request_time';
server_tokens off;
server { listen 80 default_server; server_name _; return 444; }
server {
    listen 80;
    server_name __ADC_HOST__;
    location ^~ /.well-known/acme-challenge/ { root /srv/acme; }
    location / { return 308 https://__ADC_HOST__$request_uri; }
}
server {
    listen 443 ssl default_server;
    server_name _;
    ssl_certificate /etc/adc/tls/fullchain.pem;
    ssl_certificate_key /etc/adc/tls/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    return 444;
}
server {
    listen 443 ssl;
    server_name __ADC_HOST__;
    ssl_certificate /etc/adc/tls/fullchain.pem;
    ssl_certificate_key /etc/adc/tls/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 1m;
    # URLs, query strings, cookies, forms and patient identifiers are omitted.
    access_log /var/log/nginx/adc_access.log adc_minimal;
    limit_req_status 429;
    if ($host != '__ADC_HOST__') { return 444; }
    location /static/ { alias /srv/adc/static/; autoindex off; }
    location ~ ^/(accounts|portal)/login/$ {
        limit_req zone=adc_login burst=10 nodelay;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header Connection '';
        proxy_read_timeout 35s;
        proxy_pass http://web:8000;
    }
    location / {
        limit_req zone=adc_general burst=20 nodelay;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header Connection '';
        proxy_read_timeout 35s;
        proxy_pass http://web:8000;
    }
}
