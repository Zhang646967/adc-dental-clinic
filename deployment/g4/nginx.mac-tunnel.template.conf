# Private operational metadata only; native error messages can include raw URLs.
map $request_method $adc_method {
    default OTHER;
    GET GET; HEAD HEAD; POST POST; PUT PUT; PATCH PATCH; DELETE DELETE; OPTIONS OPTIONS; TRACE TRACE;
}
map $upstream_http_x_request_id $adc_request_id {
    default $request_id;
    "~^[a-f0-9]{32}$" $upstream_http_x_request_id;
}
log_format adc_safe escape=json '{"v":1,"time":"$time_iso8601","severity":"INFO","service":"gateway","event":"gateway.completed","request_id":"$adc_request_id","method":"$adc_method","status":$status,"duration_seconds":$request_time}';
error_log /dev/null;
# Docker service addresses can change during a reviewed application update.
resolver 127.0.0.11 valid=5s ipv6=off;
upstream adc_backend {
    zone adc_backend 64k;
    server web:8000 resolve;
}
# Mac course demonstration only. This listener is published on 127.0.0.1;
# cloudflared carries requests from Cloudflare, which overwrites client-supplied
# X-Forwarded-Proto. Never publish this origin on a public/LAN interface.
server_names_hash_bucket_size 512;
# This origin is accessible only through the trusted Mac loopback tunnel.
# Cloudflare supplies CF-Connecting-IP; missing headers share the origin peer
# bucket. Never trust arbitrary X-Forwarded-For or session cookies as rate keys.
map $http_cf_connecting_ip $adc_client_key {
    "" $binary_remote_addr;
    default $http_cf_connecting_ip;
}
map $request_method $adc_login_key {
    POST $adc_client_key;
    default "";
}
limit_req_zone $adc_client_key zone=adc_general:10m rate=20r/s;
limit_req_zone $server_name zone=adc_total:1m rate=20r/s;
limit_req_zone $adc_login_key zone=adc_login:10m rate=10r/m;
server_tokens off;
server {
    access_log /dev/stdout adc_safe; listen 80 default_server; server_name _; return 444; }
server {
    access_log /dev/stdout adc_safe;
    listen 80;
    server_name __ADC_HOST__;
    proxy_hide_header X-Request-ID;
    add_header X-Request-ID $adc_request_id always;
    client_max_body_size 1m;
    limit_req_status 429;
    if ($host != '__ADC_HOST__') { return 444; }
    if ($http_x_forwarded_proto != 'https') { return 308 https://__ADC_HOST__$request_uri; }
    location /static/ { alias /srv/adc/static/; autoindex off; }
    location ~ ^/((accounts|portal)/login|portal/local-login|portal/auth/(sms|wechat/start)|portal/account/phone/sms|api/mini/v1/(login|account/local-login|auth/(wechat|sms/(send|confirm))|account/phone/sms/(send|confirm)))/$ {
        limit_req zone=adc_general burst=40 nodelay;
        limit_req zone=adc_total burst=40 nodelay;
        limit_req zone=adc_login burst=10 nodelay;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-ADC-Client-IP $http_cf_connecting_ip;
        proxy_set_header Connection '';
        proxy_read_timeout 35s;
        proxy_pass http://adc_backend;
    }
    location = /finance/reconciliation/import/ {
        client_max_body_size 3m;
        limit_req zone=adc_general burst=40 nodelay;
        limit_req zone=adc_total burst=40 nodelay;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-ADC-Client-IP $http_cf_connecting_ip;
        proxy_set_header Connection '';
        proxy_read_timeout 35s;
        proxy_pass http://adc_backend;
    }
    location / {
        limit_req zone=adc_general burst=40 nodelay;
        limit_req zone=adc_total burst=40 nodelay;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-ADC-Client-IP $http_cf_connecting_ip;
        proxy_set_header Connection '';
        proxy_read_timeout 35s;
        proxy_pass http://adc_backend;
    }
}
