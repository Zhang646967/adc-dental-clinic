name: ADC validation

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  postgresql:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Verify native mini-program source and transport
        run: node scripts/verify_wechat.cjs
      - name: Verify isolated Django and PostgreSQL behavior
        run: ./RC_MACOS.sh verify
