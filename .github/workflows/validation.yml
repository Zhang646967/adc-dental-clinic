name: ADC exact-source sharded validation

on:
  workflow_dispatch:
    inputs:
      source_commit:
        description: Exact application SHA for full validation
        required: true
        type: string

permissions:
  contents: read

jobs:
  postgresql:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1]
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ inputs.source_commit }}
      - name: Record and verify exact source
        env:
          EXPECTED_SOURCE: ${{ inputs.source_commit }}
        run: |
          ADC_TESTED_SOURCE="$(git rev-parse HEAD)"
          echo "ADC_TESTED_SOURCE=$ADC_TESTED_SOURCE"
          test "$ADC_TESTED_SOURCE" = "$EXPECTED_SOURCE"
      - name: Verify native mini-program source and transport
        run: node scripts/verify_wechat.cjs
      - name: Run isolated gate and PostgreSQL shard
        shell: bash
        env:
          ADC_TEST_SHARD: ${{ matrix.shard }}
          COMPOSE_DISABLE_ENV_FILE: '1'
        run: |
          set -euo pipefail
          adc_env="$RUNNER_TEMP/adc-verify.env"
          adc_config="$RUNNER_TEMP/adc-verify.json"
          : > "$adc_env"
          mkdir -p evidence/verification
          adc_compose=(docker compose --env-file "$adc_env" --project-directory "$PWD" -p "adc_verify_c5_$ADC_TEST_SHARD" -f compose.verify.yaml)
          trap '"${adc_compose[@]}" down --remove-orphans' EXIT
          "${adc_compose[@]}" config --format json > "$adc_config"
          docker run --rm --network none --mount "type=bind,source=$PWD,target=/src,readonly" --mount "type=bind,source=$adc_config,target=/isolation.json,readonly" -w /src python:3.13-slim python scripts/verify_isolated.py --validate-config /isolation.json --source-root "$PWD"
          "${adc_compose[@]}" build verify
          "${adc_compose[@]}" up -d --wait verify-db
          "${adc_compose[@]}" run -T --rm --no-deps -e ADC_TEST_SHARD verify python - <<'PY'
          from collections import Counter
          import hashlib
          import json
          import os
          import subprocess
          import unittest

          from scripts.integration_gate import STEPS

          assert (os.environ['DB_HOST'], os.environ['POSTGRES_DB'], os.environ['DJANGO_SETTINGS_MODULE']) == (
              'verify-db', 'adc_verify', 'config.settings.test',
          )
          for command in STEPS[:-1]:
              subprocess.run(command, check=True)
          import django
          from django.conf import settings
          from django.test.utils import get_runner

          django.setup()
          suite = get_runner(settings)(verbosity=0).build_suite(['tests'])

          def cases(suite):
              for item in suite:
                  if isinstance(item, unittest.TestSuite):
                      yield from cases(item)
                  else:
                      yield item.id()

          all_ids = sorted(cases(suite))
          assert all_ids and len(all_ids) == len(set(all_ids))
          assert all(name.startswith('tests.') for name in all_ids)
          classes = Counter(name.rsplit('.', 1)[0] for name in all_ids)
          assignments = [[], []]
          totals = [0, 0]
          for label, count in sorted(classes.items(), key=lambda row: (-row[1], row[0])):
              index = min((0, 1), key=lambda i: (totals[i], i))
              assignments[index].append(label)
              totals[index] += count
          shard = int(os.environ['ADC_TEST_SHARD'])
          assert shard in (0, 1) and all(totals) and sum(totals) == len(all_ids)
          print('ADC_SUITE_MANIFEST=' + json.dumps(dict(
              count=len(all_ids), sha256=hashlib.sha256('\n'.join(all_ids).encode()).hexdigest(),
              assigned=totals, shard=shard,
          ), sort_keys=True), flush=True)
          labels = sorted(assignments[shard])
          subprocess.run(STEPS[-1][:3] + labels + STEPS[-1][4:], check=True)
          PY
