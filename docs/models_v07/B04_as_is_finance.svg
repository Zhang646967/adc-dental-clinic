<svg xmlns="http://www.w3.org/2000/svg" width="960" height="757" viewBox="0 0 960 757">
<rect width="100%" height="100%" fill="white"/>
<defs><marker id="arrow" markerWidth="9" markerHeight="8" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#294e43"/></marker></defs>
<g font-family="Noto Sans CJK SC, sans-serif" fill="#163d32">
<text x="480.0" y="27" font-size="26" text-anchor="middle">B04 现状业务序列：跨店季度核对</text>
<rect x="5.0" y="50" width="130" height="48" rx="3" fill="#eef5f1" stroke="#57796b"/>
<text x="70.0" y="80" font-size="21" text-anchor="middle">总部管理</text>
<line x1="70.0" y1="98" x2="70.0" y2="697" stroke="#9bb0a5" stroke-dasharray="6 5"/>
<rect x="278.3333333333333" y="50" width="130" height="48" rx="3" fill="#eef5f1" stroke="#57796b"/>
<text x="343.3333333333333" y="80" font-size="21" text-anchor="middle">各店工作人员</text>
<line x1="343.3333333333333" y1="98" x2="343.3333333333333" y2="697" stroke="#9bb0a5" stroke-dasharray="6 5"/>
<rect x="551.6666666666666" y="50" width="130" height="48" rx="3" fill="#eef5f1" stroke="#57796b"/>
<text x="616.6666666666666" y="80" font-size="21" text-anchor="middle">牙医</text>
<line x1="616.6666666666666" y1="98" x2="616.6666666666666" y2="697" stroke="#9bb0a5" stroke-dasharray="6 5"/>
<rect x="825.0" y="50" width="130" height="48" rx="3" fill="#eef5f1" stroke="#57796b"/>
<text x="890.0" y="80" font-size="21" text-anchor="middle">分散业务记录</text>
<line x1="890.0" y1="98" x2="890.0" y2="697" stroke="#9bb0a5" stroke-dasharray="6 5"/>
<text x="206.66666666666666" y="155" font-size="21" text-anchor="middle">1. 请求季度业务情况</text>
<line x1="70.0" y1="164" x2="343.3333333333333" y2="164" stroke="#294e43" stroke-width="1.7" marker-end="url(#arrow)"/>
<text x="616.6666666666666" y="225" font-size="21" text-anchor="middle">2. 查找各店收入记录</text>
<line x1="343.3333333333333" y1="234" x2="890.0" y2="234" stroke="#294e43" stroke-width="1.7" marker-end="url(#arrow)"/>
<text x="616.6666666666666" y="295" font-size="21" text-anchor="middle">3. 提供本店已有资料</text>
<line x1="890.0" y1="304" x2="343.3333333333333" y2="304" stroke="#294e43" stroke-width="1.7" stroke-dasharray="6 4" marker-end="url(#arrow)"/>
<text x="480.0" y="365" font-size="21" text-anchor="middle">4. 收集成本及运营费用</text>
<line x1="343.3333333333333" y1="374" x2="616.6666666666666" y2="374" stroke="#294e43" stroke-width="1.7" marker-end="url(#arrow)"/>
<text x="480.0" y="411" font-size="21" text-anchor="middle">5. 提交相关</text>
<text x="480.0" y="435" font-size="21" text-anchor="middle">资料或缺失说明</text>
<line x1="616.6666666666666" y1="444" x2="343.3333333333333" y2="444" stroke="#294e43" stroke-width="1.7" stroke-dasharray="6 4" marker-end="url(#arrow)"/>
<text x="206.66666666666666" y="505" font-size="21" text-anchor="middle">6. 提交本店汇总</text>
<line x1="343.3333333333333" y1="514" x2="70.0" y2="514" stroke="#294e43" stroke-width="1.7" stroke-dasharray="6 4" marker-end="url(#arrow)"/>
<text x="206.66666666666666" y="551" font-size="21" text-anchor="middle">7. 发现口径或</text>
<text x="206.66666666666666" y="575" font-size="21" text-anchor="middle">缺失问题后追问</text>
<line x1="70.0" y1="584" x2="343.3333333333333" y2="584" stroke="#294e43" stroke-width="1.7" marker-end="url(#arrow)"/>
<text x="206.66666666666666" y="621" font-size="21" text-anchor="middle">8. 补充材料</text>
<text x="206.66666666666666" y="645" font-size="21" text-anchor="middle">供总部再核对</text>
<line x1="343.3333333333333" y1="654" x2="70.0" y2="654" stroke="#294e43" stroke-width="1.7" stroke-dasharray="6 4" marker-end="url(#arrow)"/>
<text x="30" y="733" font-size="18" fill="#596d64">建模假设 A3：具体汇总职责与追问过程为分析假设；不声称案例指定了 Excel/纸质流程。</text>
</g></svg>