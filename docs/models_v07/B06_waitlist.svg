<svg xmlns="http://www.w3.org/2000/svg" width="960" height="897" viewBox="0 0 960 897">
<rect width="100%" height="100%" fill="white"/>
<defs><marker id="arrow" markerWidth="9" markerHeight="8" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#294e43"/></marker></defs>
<g font-family="Noto Sans CJK SC, sans-serif" fill="#163d32">
<text x="480.0" y="27" font-size="26" text-anchor="middle">B06 改进后业务序列：候补与人工确认排程</text>
<rect x="5.0" y="50" width="130" height="48" rx="3" fill="#eef5f1" stroke="#57796b"/>
<text x="70.0" y="80" font-size="21" text-anchor="middle">患者/前台</text>
<line x1="70.0" y1="98" x2="70.0" y2="837" stroke="#9bb0a5" stroke-dasharray="6 5"/>
<rect x="415.0" y="50" width="130" height="48" rx="3" fill="#eef5f1" stroke="#57796b"/>
<text x="480.0" y="80" font-size="21" text-anchor="middle">ADC 服务系统</text>
<line x1="480.0" y1="98" x2="480.0" y2="837" stroke="#9bb0a5" stroke-dasharray="6 5"/>
<rect x="825.0" y="50" width="130" height="48" rx="3" fill="#eef5f1" stroke="#57796b"/>
<text x="890.0" y="80" font-size="21" text-anchor="middle">诊所主管</text>
<line x1="890.0" y1="98" x2="890.0" y2="837" stroke="#9bb0a5" stroke-dasharray="6 5"/>
<text x="275.0" y="155" font-size="21" text-anchor="middle">1. 登记可接受诊所与时间</text>
<line x1="70.0" y1="164" x2="480.0" y2="164" stroke="#294e43" stroke-width="1.7" marker-end="url(#arrow)"/>
<text x="275.0" y="225" font-size="21" text-anchor="middle">2. 返回等待安排状态</text>
<line x1="480.0" y1="234" x2="70.0" y2="234" stroke="#294e43" stroke-width="1.7" stroke-dasharray="6 4" marker-end="url(#arrow)"/>
<text x="685.0" y="295" font-size="21" text-anchor="middle">3. 请求本店候补安排建议</text>
<line x1="890.0" y1="304" x2="480.0" y2="304" stroke="#294e43" stroke-width="1.7" marker-end="url(#arrow)"/>
<text x="685.0" y="365" font-size="21" text-anchor="middle">4. 返回匹配、未安排项与范围说明</text>
<line x1="480.0" y1="374" x2="890.0" y2="374" stroke="#294e43" stroke-width="1.7" stroke-dasharray="6 4" marker-end="url(#arrow)"/>
<text x="685.0" y="435" font-size="21" text-anchor="middle">5. 核对后发布限时邀约</text>
<line x1="890.0" y1="444" x2="480.0" y2="444" stroke="#294e43" stroke-width="1.7" marker-end="url(#arrow)"/>
<text x="275.0" y="505" font-size="21" text-anchor="middle">6. 主动查看本人候补邀约</text>
<line x1="70.0" y1="514" x2="480.0" y2="514" stroke="#294e43" stroke-width="1.7" marker-end="url(#arrow)"/>
<text x="275.0" y="575" font-size="21" text-anchor="middle">7. 显示具体时段与确认期限</text>
<line x1="480.0" y1="584" x2="70.0" y2="584" stroke="#294e43" stroke-width="1.7" stroke-dasharray="6 4" marker-end="url(#arrow)"/>
<text x="275.0" y="645" font-size="21" text-anchor="middle">8. 核对后明确接受</text>
<line x1="70.0" y1="654" x2="480.0" y2="654" stroke="#294e43" stroke-width="1.7" marker-end="url(#arrow)"/>
<text x="275.0" y="715" font-size="21" text-anchor="middle">9. 重新校验成功后返回正式预约</text>
<line x1="480.0" y1="724" x2="70.0" y2="724" stroke="#294e43" stroke-width="1.7" stroke-dasharray="6 4" marker-end="url(#arrow)"/>
<text x="685.0" y="785" font-size="21" text-anchor="middle">10. 明确回收过期邀约供再安排</text>
<line x1="890.0" y1="794" x2="480.0" y2="794" stroke="#294e43" stroke-width="1.7" marker-end="url(#arrow)"/>
<text x="30" y="873" font-size="18" fill="#596d64">本版无短信/邮件推送；建议和邀约都不等于预约。拒绝/过期不创建预约。</text>
</g></svg>