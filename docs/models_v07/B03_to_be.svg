<g font-family="Noto Sans CJK SC, sans-serif" fill="#163d32">
<text x="480.0" y="27" font-size="26" text-anchor="middle">B03 改进后业务序列：统一预约与接诊结算</text>
<rect x="5.0" y="50" width="130" height="48" rx="3" fill="#eef5f1" stroke="#57796b"/>
<text x="70.0" y="80" font-size="21" text-anchor="middle">患者</text>
<line x1="70.0" y1="98" x2="70.0" y2="837" stroke="#9bb0a5" stroke-dasharray="6 5"/>
<rect x="278.3333333333333" y="50" width="130" height="48" rx="3" fill="#eef5f1" stroke="#57796b"/>
<text x="343.3333333333333" y="80" font-size="21" text-anchor="middle">前台</text>
<line x1="343.3333333333333" y1="98" x2="343.3333333333333" y2="837" stroke="#9bb0a5" stroke-dasharray="6 5"/>
<rect x="551.6666666666666" y="50" width="130" height="48" rx="3" fill="#eef5f1" stroke="#57796b"/>
<text x="616.6666666666666" y="80" font-size="21" text-anchor="middle">ADC 服务系统</text>
<line x1="616.6666666666666" y1="98" x2="616.6666666666666" y2="837" stroke="#9bb0a5" stroke-dasharray="6 5"/>
<rect x="825.0" y="50" width="130" height="48" rx="3" fill="#eef5f1" stroke="#57796b"/>
<text x="890.0" y="80" font-size="21" text-anchor="middle">负责牙医</text>
<line x1="890.0" y1="98" x2="890.0" y2="837" stroke="#9bb0a5" stroke-dasharray="6 5"/>
<text x="343.3333333333333" y="155" font-size="21" text-anchor="middle">1. 选择时段并明确确认</text>
<line x1="70.0" y1="164" x2="616.6666666666666" y2="164" stroke="#294e43" stroke-width="1.7" marker-end="url(#arrow)"/>
<text x="343.3333333333333" y="225" font-size="21" text-anchor="middle">2. 返回预约编号和状态</text>
<line x1="616.6666666666666" y1="234" x2="70.0" y2="234" stroke="#294e43" stroke-width="1.7" stroke-dasharray="6 4" marker-end="url(#arrow)"/>
<text x="480.0" y="295" font-size="21" text-anchor="middle">3. 核对患者并登记到诊</text>
<line x1="343.3333333333333" y1="304" x2="616.6666666666666" y2="304" stroke="#294e43" stroke-width="1.7" marker-end="url(#arrow)"/>
<text x="753.3333333333333" y="365" font-size="21" text-anchor="middle">4. 打开本人负责的接诊</text>
<line x1="890.0" y1="374" x2="616.6666666666666" y2="374" stroke="#294e43" stroke-width="1.7" marker-end="url(#arrow)"/>
<text x="753.3333333333333" y="411" font-size="21" text-anchor="middle">5. 提供主诉、</text>
<text x="753.3333333333333" y="435" font-size="21" text-anchor="middle">过敏及授权记录</text>
<line x1="616.6666666666666" y1="444" x2="890.0" y2="444" stroke="#294e43" stroke-width="1.7" stroke-dasharray="6 4" marker-end="url(#arrow)"/>
<text x="753.3333333333333" y="481" font-size="21" text-anchor="middle">6. 复核信息</text>
<text x="753.3333333333333" y="505" font-size="21" text-anchor="middle">并记录实际治疗</text>
<line x1="890.0" y1="514" x2="616.6666666666666" y2="514" stroke="#294e43" stroke-width="1.7" marker-end="url(#arrow)"/>
<text x="753.3333333333333" y="551" font-size="21" text-anchor="middle">7. 核对后确认</text>
<text x="753.3333333333333" y="575" font-size="21" text-anchor="middle">完成或无治疗关闭</text>
<line x1="890.0" y1="584" x2="616.6666666666666" y2="584" stroke="#294e43" stroke-width="1.7" marker-end="url(#arrow)"/>
<text x="753.3333333333333" y="645" font-size="21" text-anchor="middle">8. 返回唯一结算单</text>
<line x1="616.6666666666666" y1="654" x2="890.0" y2="654" stroke="#294e43" stroke-width="1.7" stroke-dasharray="6 4" marker-end="url(#arrow)"/>
<text x="343.3333333333333" y="715" font-size="21" text-anchor="middle">9. 查询本人账单</text>
<line x1="70.0" y1="724" x2="616.6666666666666" y2="724" stroke="#294e43" stroke-width="1.7" marker-end="url(#arrow)"/>
<text x="343.3333333333333" y="785" font-size="21" text-anchor="middle">10. 展示费用明细与版本</text>
<line x1="616.6666666666666" y1="794" x2="70.0" y2="794" stroke="#294e43" stroke-width="1.7" stroke-dasharray="6 4" marker-end="url(#arrow)"/>
<text x="30" y="873" font-size="18" fill="#596d64">目标业务协作；未展示控制器、SQL 或类调用。人工渠道与自助渠道共用业务规则。</text>
