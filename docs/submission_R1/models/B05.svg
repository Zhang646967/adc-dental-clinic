<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="795" viewBox="0 0 1100 795"><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#263c49"/></marker><marker id="reply" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10" fill="none" stroke="#263c49" stroke-width="1.5"/></marker></defs><rect width="1100" height="795" fill="white"/><g font-family="Noto Sans CJK SC,sans-serif" fill="#183b48"><rect x="6.0" y="18" width="188" height="91" rx="2" fill="#edf4f4" stroke="#516e7a" stroke-width="1.8"/><text x="100.0" y="53" font-size="21" text-anchor="middle">财务人员</text><text x="100.0" y="82" font-size="21" text-anchor="middle">业务工作者</text><line x1="100.0" y1="109" x2="100.0" y2="783" stroke="#91a3ad" stroke-width="1.3" stroke-dasharray="8,7"/><rect x="306.0" y="18" width="188" height="91" rx="2" fill="#edf4f4" stroke="#516e7a" stroke-width="1.8"/><text x="400.0" y="53" font-size="21" text-anchor="middle">各店／牙医</text><text x="400.0" y="82" font-size="21" text-anchor="middle">资料提供者</text><line x1="400.0" y1="109" x2="400.0" y2="783" stroke="#91a3ad" stroke-width="1.3" stroke-dasharray="8,7"/><rect x="606.0" y="18" width="188" height="91" rx="2" fill="#edf4f4" stroke="#516e7a" stroke-width="1.8"/><text x="700.0" y="53" font-size="21" text-anchor="middle">ADC服务系统</text><text x="700.0" y="82" font-size="21" text-anchor="middle">业务支持者</text><line x1="700.0" y1="109" x2="700.0" y2="783" stroke="#91a3ad" stroke-width="1.3" stroke-dasharray="8,7"/><rect x="906.0" y="18" width="188" height="91" rx="2" fill="#edf4f4" stroke="#516e7a" stroke-width="1.8"/><text x="1000.0" y="53" font-size="21" text-anchor="middle">总部管理</text><text x="1000.0" y="82" font-size="21" text-anchor="middle">结果使用者</text><line x1="1000.0" y1="109" x2="1000.0" y2="783" stroke="#91a3ad" stroke-width="1.3" stroke-dasharray="8,7"/><text x="250.0" y="173" text-anchor="middle" font-size="21">1. 收集并核对成本资料</text><line x1="100.0" y1="192" x2="400.0" y2="192" stroke="#263c49" stroke-width="1.9" marker-end="url(#arrow)" /><text x="250.0" y="242" text-anchor="middle" font-size="21">2. 提供金额与缺项依据</text><line x1="400.0" y1="261" x2="100.0" y2="261" stroke="#263c49" stroke-width="1.9" marker-end="url(#reply)" stroke-dasharray="7,5"/><text x="400.0" y="311" text-anchor="middle" font-size="21">3. 建立自然季度和纳入清单</text><line x1="100.0" y1="330" x2="700.0" y2="330" stroke="#263c49" stroke-width="1.9" marker-end="url(#arrow)" /><text x="400.0" y="380" text-anchor="middle" font-size="21">4. 录入、逐人核对并确认成本</text><line x1="100.0" y1="399" x2="700.0" y2="399" stroke="#263c49" stroke-width="1.9" marker-end="url(#arrow)" /><text x="400.0" y="449" text-anchor="middle" font-size="21">5. 反馈未确认成本或遗漏牙医</text><line x1="700.0" y1="468" x2="100.0" y2="468" stroke="#263c49" stroke-width="1.9" marker-end="url(#reply)" stroke-dasharray="7,5"/><rect x="10" y="487" width="1080" height="43" fill="#f5f8fa" stroke="#8b9eaa"/><text x="24" y="516" font-size="20">资料尚不完整时：只展示缺项，不产生完整利润结论</text><text x="400.0" y="576" text-anchor="middle" font-size="21">6. 补充核对，确认纳入范围</text><line x1="100.0" y1="595" x2="700.0" y2="595" stroke="#263c49" stroke-width="1.9" marker-end="url(#arrow)" /><text x="850.0" y="645" text-anchor="middle" font-size="21">7. 请求获授权的季度报告</text><line x1="1000.0" y1="664" x2="700.0" y2="664" stroke="#263c49" stroke-width="1.9" marker-end="url(#arrow)" /><text x="850.0" y="714" text-anchor="middle" font-size="21">8. 返回缺项或完整测算</text><line x1="700.0" y1="733" x2="1000.0" y2="733" stroke="#263c49" stroke-width="1.9" marker-end="url(#reply)" stroke-dasharray="7,5"/></g></svg>