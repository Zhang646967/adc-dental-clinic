<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="1267" viewBox="0 0 1100 1267"><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#263c49"/></marker><marker id="reply" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10" fill="none" stroke="#263c49" stroke-width="1.5"/></marker></defs><rect width="1100" height="1267" fill="white"/><g font-family="Noto Sans CJK SC,sans-serif" fill="#183b48"><rect x="6.0" y="18" width="188" height="91" rx="2" fill="#edf4f4" stroke="#516e7a" stroke-width="1.8"/><text x="100.0" y="53" font-size="21" text-anchor="middle">患者</text><line x1="100.0" y1="109" x2="100.0" y2="1255" stroke="#91a3ad" stroke-width="1.3" stroke-dasharray="8,7"/><rect x="306.0" y="18" width="188" height="91" rx="2" fill="#edf4f4" stroke="#516e7a" stroke-width="1.8"/><text x="400.0" y="53" font-size="21" text-anchor="middle">诊所前台</text><text x="400.0" y="82" font-size="21" text-anchor="middle">业务工作者</text><line x1="400.0" y1="109" x2="400.0" y2="1255" stroke="#91a3ad" stroke-width="1.3" stroke-dasharray="8,7"/><rect x="606.0" y="18" width="188" height="91" rx="2" fill="#edf4f4" stroke="#516e7a" stroke-width="1.8"/><text x="700.0" y="53" font-size="21" text-anchor="middle">ADC服务系统</text><text x="700.0" y="82" font-size="21" text-anchor="middle">业务支持者</text><line x1="700.0" y1="109" x2="700.0" y2="1255" stroke="#91a3ad" stroke-width="1.3" stroke-dasharray="8,7"/><rect x="906.0" y="18" width="188" height="91" rx="2" fill="#edf4f4" stroke="#516e7a" stroke-width="1.8"/><text x="1000.0" y="53" font-size="21" text-anchor="middle">负责牙医</text><text x="1000.0" y="82" font-size="21" text-anchor="middle">业务工作者</text><line x1="1000.0" y1="109" x2="1000.0" y2="1255" stroke="#91a3ad" stroke-width="1.3" stroke-dasharray="8,7"/><rect x="10" y="142" width="1080" height="43" fill="#f5f8fa" stroke="#8b9eaa"/><text x="24" y="171" font-size="20">预约主成功场景：先核对并复用患者档案；新患者须按SU-03建档</text><text x="250.0" y="231" text-anchor="middle" font-size="21">1. 提出时间偏好</text><line x1="100.0" y1="250" x2="400.0" y2="250" stroke="#263c49" stroke-width="1.9" marker-end="url(#arrow)" /><text x="550.0" y="300" text-anchor="middle" font-size="21">2. 查资料与可用时段</text><line x1="400.0" y1="319" x2="700.0" y2="319" stroke="#263c49" stroke-width="1.9" marker-end="url(#arrow)" /><text x="550.0" y="369" text-anchor="middle" font-size="21">3. 返回资料和时段</text><line x1="700.0" y1="388" x2="400.0" y2="388" stroke="#263c49" stroke-width="1.9" marker-end="url(#reply)" stroke-dasharray="7,5"/><text x="250.0" y="438" text-anchor="middle" font-size="21">4. 核对牙医、诊所和时间</text><line x1="400.0" y1="457" x2="100.0" y2="457" stroke="#263c49" stroke-width="1.9" marker-end="url(#arrow)" /><text x="250.0" y="507" text-anchor="middle" font-size="21">5. 明确同意安排</text><line x1="100.0" y1="526" x2="400.0" y2="526" stroke="#263c49" stroke-width="1.9" marker-end="url(#reply)" stroke-dasharray="7,5"/><text x="550.0" y="576" text-anchor="middle" font-size="21">6. 提交并重验时段</text><line x1="400.0" y1="595" x2="700.0" y2="595" stroke="#263c49" stroke-width="1.9" marker-end="url(#arrow)" /><text x="550.0" y="645" text-anchor="middle" font-size="21">7. 返回预约编号</text><line x1="700.0" y1="664" x2="400.0" y2="664" stroke="#263c49" stroke-width="1.9" marker-end="url(#reply)" stroke-dasharray="7,5"/><rect x="10" y="683" width="1080" height="43" fill="#f5f8fa" stroke="#8b9eaa"/><text x="24" y="712" font-size="20">预约成功且患者实际到达后</text><text x="250.0" y="772" text-anchor="middle" font-size="21">8. 报告到诊</text><line x1="100.0" y1="791" x2="400.0" y2="791" stroke="#263c49" stroke-width="1.9" marker-end="url(#arrow)" /><text x="550.0" y="841" text-anchor="middle" font-size="21">9. 登记实际到诊</text><line x1="400.0" y1="860" x2="700.0" y2="860" stroke="#263c49" stroke-width="1.9" marker-end="url(#arrow)" /><text x="850.0" y="910" text-anchor="middle" font-size="21">10. 复核过敏并记录治疗</text><line x1="1000.0" y1="929" x2="700.0" y2="929" stroke="#263c49" stroke-width="1.9" marker-end="url(#arrow)" /><text x="850.0" y="979" text-anchor="middle" font-size="21">11. 核对费用并确认完成</text><line x1="1000.0" y1="998" x2="700.0" y2="998" stroke="#263c49" stroke-width="1.9" marker-end="url(#arrow)" /><text x="850.0" y="1048" text-anchor="middle" font-size="21">12. 返回结算单与状态</text><line x1="700.0" y1="1067" x2="1000.0" y2="1067" stroke="#263c49" stroke-width="1.9" marker-end="url(#reply)" stroke-dasharray="7,5"/><text x="400.0" y="1117" text-anchor="middle" font-size="21">13. 查阅本人账单</text><line x1="100.0" y1="1136" x2="700.0" y2="1136" stroke="#263c49" stroke-width="1.9" marker-end="url(#arrow)" /><text x="400.0" y="1186" text-anchor="middle" font-size="21">14. 展示明细、金额与版本</text><line x1="700.0" y1="1205" x2="100.0" y2="1205" stroke="#263c49" stroke-width="1.9" marker-end="url(#reply)" stroke-dasharray="7,5"/></g></svg>