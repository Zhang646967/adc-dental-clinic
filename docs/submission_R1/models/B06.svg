<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="1187" viewBox="0 0 1100 1187"><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#263c49"/></marker><marker id="reply" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10" fill="none" stroke="#263c49" stroke-width="1.5"/></marker></defs><rect width="1100" height="1187" fill="white"/><g font-family="Noto Sans CJK SC,sans-serif" fill="#183b48"><rect x="6.0" y="18" width="188" height="91" rx="2" fill="#edf4f4" stroke="#516e7a" stroke-width="1.8"/><text x="100.0" y="53" font-size="21" text-anchor="middle">患者／代办前台</text><text x="100.0" y="82" font-size="21" text-anchor="middle">办理者</text><line x1="100.0" y1="109" x2="100.0" y2="1175" stroke="#91a3ad" stroke-width="1.3" stroke-dasharray="8,7"/><rect x="456.0" y="18" width="188" height="91" rx="2" fill="#edf4f4" stroke="#516e7a" stroke-width="1.8"/><text x="550.0" y="53" font-size="21" text-anchor="middle">ADC服务系统</text><text x="550.0" y="82" font-size="21" text-anchor="middle">业务支持者</text><line x1="550.0" y1="109" x2="550.0" y2="1175" stroke="#91a3ad" stroke-width="1.3" stroke-dasharray="8,7"/><rect x="906.0" y="18" width="188" height="91" rx="2" fill="#edf4f4" stroke="#516e7a" stroke-width="1.8"/><text x="1000.0" y="53" font-size="21" text-anchor="middle">诊所主管</text><text x="1000.0" y="82" font-size="21" text-anchor="middle">协调者</text><line x1="1000.0" y1="109" x2="1000.0" y2="1175" stroke="#91a3ad" stroke-width="1.3" stroke-dasharray="8,7"/><rect x="10" y="694" width="1080" height="400" fill="none" stroke="#57717e" stroke-width="2"/><text x="325.0" y="173" text-anchor="middle" font-size="21">1. 提交诊所与可接受时间范围</text><line x1="100.0" y1="192" x2="550.0" y2="192" stroke="#263c49" stroke-width="1.9" marker-end="url(#arrow)" /><text x="325.0" y="242" text-anchor="middle" font-size="21">2. 返回等待安排；尚无正式预约</text><line x1="550.0" y1="261" x2="100.0" y2="261" stroke="#263c49" stroke-width="1.9" marker-end="url(#reply)" stroke-dasharray="7,5"/><text x="775.0" y="311" text-anchor="middle" font-size="21">3. 为本店候补生成有限匹配建议</text><line x1="1000.0" y1="330" x2="550.0" y2="330" stroke="#263c49" stroke-width="1.9" marker-end="url(#arrow)" /><text x="775.0" y="380" text-anchor="middle" font-size="21">4. 返回候选、未安排项与能力边界</text><line x1="550.0" y1="399" x2="1000.0" y2="399" stroke="#263c49" stroke-width="1.9" marker-end="url(#reply)" stroke-dasharray="7,5"/><text x="775.0" y="449" text-anchor="middle" font-size="21">5. 核对并发布限时邀约</text><line x1="1000.0" y1="468" x2="550.0" y2="468" stroke="#263c49" stroke-width="1.9" marker-end="url(#arrow)" /><text x="775.0" y="518" text-anchor="middle" font-size="21">6. 发布结果及实际确认期限</text><line x1="550.0" y1="537" x2="1000.0" y2="537" stroke="#263c49" stroke-width="1.9" marker-end="url(#reply)" stroke-dasharray="7,5"/><text x="325.0" y="587" text-anchor="middle" font-size="21">7. 主动查看候补邀约</text><line x1="100.0" y1="606" x2="550.0" y2="606" stroke="#263c49" stroke-width="1.9" marker-end="url(#arrow)" /><text x="325.0" y="656" text-anchor="middle" font-size="21">8. 显示牙医、时段及确认期限</text><line x1="550.0" y1="675" x2="100.0" y2="675" stroke="#263c49" stroke-width="1.9" marker-end="url(#reply)" stroke-dasharray="7,5"/><rect x="10" y="694" width="1080" height="43" fill="#f5f8fa" stroke="#8b9eaa"/><text x="24" y="723" font-size="20">alt [患者在有效期内明确接受]</text><text x="325.0" y="783" text-anchor="middle" font-size="21">9. 核对后提交接受</text><line x1="100.0" y1="802" x2="550.0" y2="802" stroke="#263c49" stroke-width="1.9" marker-end="url(#arrow)" /><text x="325.0" y="852" text-anchor="middle" font-size="21">10. 重验成功：返回正式预约编号</text><line x1="550.0" y1="871" x2="100.0" y2="871" stroke="#263c49" stroke-width="1.9" marker-end="url(#reply)" stroke-dasharray="7,5"/><rect x="10" y="890" width="1080" height="43" fill="#f5f8fa" stroke="#8b9eaa"/><text x="24" y="919" font-size="20">else [拒绝，或到期后尝试接受]</text><text x="325.0" y="979" text-anchor="middle" font-size="21">11. 提交拒绝或已过期的接受请求</text><line x1="100.0" y1="998" x2="550.0" y2="998" stroke="#263c49" stroke-width="1.9" marker-end="url(#arrow)" /><text x="325.0" y="1048" text-anchor="middle" font-size="21">12. 拒绝则回到等待；过期接受不建预约</text><line x1="550.0" y1="1067" x2="100.0" y2="1067" stroke="#263c49" stroke-width="1.9" marker-end="url(#reply)" stroke-dasharray="7,5"/><rect x="10" y="1086" width="1080" height="43" fill="#f5f8fa" stroke="#8b9eaa"/><text x="24" y="1115" font-size="20">end；过期请求需另由本店前台／主管手动回收，才能再次参与匹配</text></g></svg>