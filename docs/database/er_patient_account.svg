<svg role="img" aria-labelledby="er_patient_account-title er_patient_account-desc" width="877pt" height="632pt"
 viewBox="0.00 0.00 877.00 632.00" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink"><title id="er_patient_account-title">患者渠道账号、凭证与联络来源</title><desc id="er_patient_account-desc">外部身份按provider、app_id及subject联合唯一，当前账号引用可空；每个账号至多一个有效SMS登录身份，此条件不限制其余微信或本地绑定。解绑保留账号与事件。短信挑战仅BIND用途必须引用当前账号，LOGIN用途引用为空；会话摘要不是关系外键。ADC生成的验证码只存HMAC摘要；CloudBase生成并核验验证码，ADC只保存provider_reference挑战引用。两类均与用途、会话、期限及一次性使用绑定。账号联络按user一对一，不按手机号连接Patient。微信身份由服务端交换，LOCAL与DEMO来源仍明确标注；登录与手机号核验不授予员工、临床或患者档案权限。</desc>
