 viewBox="0.00 0.00 654.00 681.00" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink"><title id="er_insurance_policy-title">医保目录版本、门店安排与收费适配</title><desc id="er_insurance_policy-desc">目录保留原文件及规范记录，编码在目录内唯一；空白单位及规则保持未知。政策版本与审阅次数分开，同一来源至多一个待核对或已启用记录；未通过或停用后可明确提交下一次审阅，前次引用可空且唯一，原决定不改写。门店已确认安排按本店日期排斥重叠；收费映射按本店与收费项目限制一个启用结果。不同账号独立复核，重新核对不恢复旧安排或映射。图中省略操作人及其余事件分支，全部关系见完整目录；本图不表示真实定点资格或资金结算。</desc>
