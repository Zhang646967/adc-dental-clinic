 viewBox="0.00 0.00 714.00 632.00" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink"><title id="er_consent_events-title">医疗问答与决定来源</title><desc id="er_consent_events-desc">每个事件只能属于一份准确告知；本人来源引用自己的PatientAccess，纸质原件登记不冒充本人点击。reply_to为可空一对一答复关系，同一问题不能被重复覆盖，触发器核对同入口问题。历史事件不可改写；撤回另记事件，未答复问题和新版本待决定由事件推导。预约代办授权不作为临床读取或医疗代签依据。 PROXY_ACCOUNT保留独立医疗代理版本与实际提交账号，纸件仍由负责医师登记；任一来源均不证明已验收可靠电子签名。</desc>
