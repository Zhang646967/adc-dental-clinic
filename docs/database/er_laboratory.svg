<svg role="img" aria-labelledby="er_laboratory-title er_laboratory-desc" width="430pt" height="809pt"
 viewBox="0.00 0.00 430.00 809.00" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink"><title id="er_laboratory-title">加工请求、物理送返与具体版本验收</title><desc id="er_laboratory-desc">医师请求绑定原确认检查及已接受具体方案步骤。送出、返回是手工交接事实，不代表临床适配；每次返工须经过新送返周期。验收绑定本周期及当前确切步骤版本，跨版本复用必须重新明确核对。前台不读取加工临床规格或验收详情；原需要日期与预约保留。只在所需加工件全部有效验收后允许相应实际执行，不自动产生收费。</desc>
