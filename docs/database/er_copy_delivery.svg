 viewBox="0.00 0.00 386.00 483.00" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink"><title id="er_copy_delivery-title">固定副本、受控领取与追加历史</title><desc id="er_copy_delivery-desc">一份获准申请至多生成一个固定副本文件；字节、摘要、清单及办理事件不可覆盖。短时领取凭据绑定原登录账号和工作区，持链接而无会话不能读取；下载时重核领取权、期限和准确文件。服务端响应记录不表示患者已经阅读。到期按读取时间判断，不删除文件和历史；撤销只停止后续领取，已交付本地副本无法远程收回。</desc>
