 viewBox="0.00 0.00 792.00 582.00" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink"><title id="er_profile_affiliation-title">统一医师身份、门店任职与专业授权</title><desc id="er_profile_affiliation-desc">统一医师可有多个接诊门店，每对医师与门店唯一；常驻与轮诊不复制身份。任职有效期、独立专业授权及前台出诊为不同合同，任职不自动授予诊疗权限。门店任职控制须先核对原出诊和承诺再明确启用；退出阻止新增排班与预约，保留原约并交前台协调，单纯撤回介绍不结束任职。</desc>
