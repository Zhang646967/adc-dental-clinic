 viewBox="0.00 0.00 356.00 770.00" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink"><title id="er_document_responsibility-title">文书责任期限与追加办理凭据</title><desc id="er_document_responsibility-desc">新检查开始时形成责任文书待办，不补造旧签署。原办理期限保留，更正有自己的期限，下次跟进不消除超期事实；待签、来源变化和超期由当前事实推导，不是独立虚构SQL状态表。确认人与事件均为真实账号外键，事件操作号唯一。账号确认、纸质原件引用及可靠电子签名分开；既有专业范围仍须重检，责任归属不自动授予权限。</desc>
