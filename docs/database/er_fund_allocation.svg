<svg role="img" aria-labelledby="er_fund_allocation-title er_fund_allocation-desc" width="698pt" height="671pt"
 viewBox="0.00 0.00 698.00 671.00" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink"><title id="er_fund_allocation-title">银行流水独占使用与基金逐笔分配</title><desc id="er_fund_allocation-desc">流水用途恰好引用现金匹配或基金凭据之一，两个来源各唯一且可空；每条流水至多一个活动用途。旧活动匹配仅派生用途记录，不重写原决定。已核对基金凭据可分批关联多笔同店同币种申报；分配行在批次内按申报唯一。待审及已通过分配共同限制可用银行金额；待审退回不能使用尚未确认的入账。到账、退回、现金账及原收入分开，完整账户和人员关系见目录。</desc>
