 viewBox="0.00 0.00 305.00 532.00" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink"><title id="er_clinic_directory-title">门店公开资料与发布历史</title><desc id="er_clinic_directory-desc">每家诊所至多一份当前公开资料；业务名称和既有单据身份不随公开别名改写。发布版本按资料及版号唯一，操作编号唯一，历史只追加。营业时间由科室开放和明确停用区间推导，不在资料中重复维护；WGS84排序与GCJ02导航坐标分开，坐标缺失保持未知。外键不授予岗位权限。</desc>
