 viewBox="0.00 0.00 542.00 770.00" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink"><title id="er_medical_proxy-title">医疗代理材料版本与限定步骤</title><desc id="er_medical_proxy-desc">代理身份、诊所、依据类型保持不变；材料修订追加版本，范围指向稳定步骤。前台专项核验与医师适用性确认分开，疑难事项转另一审核医师。有效期和患者身份在读取与提交时重检，预约授权不能转换为医疗授权。图仅绘实际SQL外键，计划及临床审核关系详见全字段目录。</desc>
