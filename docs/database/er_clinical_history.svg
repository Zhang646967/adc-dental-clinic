 viewBox="0.00 0.00 449.00 646.00" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink"><title id="er_clinical_history-title">患者自述来源与医师核对</title><desc id="er_clinical_history-desc">本人提交不归属某次预约或诊所；医师面谈引用实际就诊及当前诊所。患者与来源诊所及版号组成唯一键，空诊所也参与唯一性；各来源分别追加版本。检查记录可引用一个已核对的具体版本，并保留核对结论、差异和可见来源游标。自述不覆盖已复核过敏资料；外键不授予跨店查阅权限。</desc>
