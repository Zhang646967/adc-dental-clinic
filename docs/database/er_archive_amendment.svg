 viewBox="0.00 0.00 773.00 582.00" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink"><title id="er_archive_amendment-title">准确补正批准与临床追加版本</title><desc id="er_archive_amendment-desc">补正针对完整文书或检查牙位的准确草稿，保留原包、差异和原因。独立批准后仍由负责医师确认；实际追加版本通过两个可空一对一结果关系恰选一个，未实施时两者为空。数据库延迟约束核对追加版本与批准内容、来源相同；批准不是直接改病历，旧批准不能套用变化后的草稿。补正后另提补充归档，原包继续可读。 审核人与委任的完整关系见归档提交视图；本图保留相关外键列，仅展开补正结果关系。</desc>
