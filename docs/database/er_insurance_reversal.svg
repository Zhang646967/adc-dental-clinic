 viewBox="0.00 0.00 595.00 483.00" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink"><title id="er_insurance_reversal-title">原结算撤销、原结果查询与独立退回核对</title><desc id="er_insurance_reversal-desc">每笔原结算至多一个保留的撤销请求，撤销结果一对一引用；未知和处理中继续查询同一编号。复核可追加未通过决定，但至多一次通过；实际通过须已核对原撤销结果、基金净到账归零且没有待审分配或患者现金。撤销中的原已通过分担保持，原未通过分担不会产生抵扣。事件记录当时撤销状态；撤销不作废实际费用，不自动收退款。</desc>
