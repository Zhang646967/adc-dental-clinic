<svg role="img" aria-labelledby="er_insurance_settlement-title er_insurance_settlement-desc" width="734pt" height="621pt"
 viewBox="0.00 0.00 734.00 621.00" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink"><title id="er_insurance_settlement-title">原实际费用、唯一结算与独立分担</title><desc id="er_insurance_settlement-desc">每笔请求保留原账单的确切发布版本和全部实际收费行；同一账单至多一个未终结请求。原始模拟结果和独立分担复核分别一对一引用请求，回复未知时查询原编号，不重新申报。逐行现金责任、个人账户与基金之和等于原行金额；独立通过才影响患者待缴，不产生现金或新增收入。目录、待遇、操作人及事件外键见完整目录。</desc>
