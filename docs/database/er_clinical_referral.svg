 viewBox="0.00 0.00 692.00 809.00" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink"><title id="er_clinical_referral-title">限定跨店转诊与敏感查阅留痕</title><desc id="er_clinical_referral-desc">转诊保留原患者、原就诊、转出／接收诊所及指定医师。来源可不选，选择时至多引用一个旧发布版本或结构化检查确认版本；必须属于同次原就诊。后续更正不改写已选择的版本。身份核对、临床披露同意和医师接收分别办理。查阅事件的object_kind/object_id为受控类型与对象编号，不是虚构外键。其余来源及有效期在完整目录保留。</desc>
