 viewBox="0.00 0.00 767.00 508.00" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink"><title id="er_clinical_recall-title">复诊责任、沟通与实际完成依据</title><desc id="er_clinical_recall-desc">一条后续要求至多一份随访责任，状态、负责人和期限变化追加事件。完成时仅选择同患者、同店、同服务且明确关联的已关闭后续就诊事实；确认检查或指定步骤完成依据二选一。晚于建议窗口如实记录，不改原日期。患者暂不继续转医师核对，未经明确恢复不重复对外联系，也不自动取消预约。</desc>
