 viewBox="0.00 0.00 669.00 458.00" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink"><title id="er_next_visit-title">医师后续要求与原预约关联</title><desc id="er_next_visit-desc">后续要求保留原检查、具体步骤、服务、建议窗口和完成标准；前台只读取安排所需投影。先经统一资源规则成约，再明确关联原预约；改期沿唯一后继关系跟踪，取消不代表复诊完成。一次部分治疗关闭后，如未达到明确完成标准，可以继续安排。历史未登记完成标准的记录保留未明确状态。</desc>
