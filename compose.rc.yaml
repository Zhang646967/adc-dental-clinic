{
  "x-app": {
    "build": {
      "context": ".",
      "dockerfile": "Dockerfile.production"
    },
    "image": "${RC_PROJECT:?Prepare RC configuration}-app:1.0.0-rc.1",
    "environment": {
      "ADC_RC_SYNTHETIC": "1",
      "ADC_RC_INSTANCE": "${RC_PROJECT:?}",
      "DJANGO_SETTINGS_MODULE": "config.settings.course_demo",
      "DJANGO_SECRET_KEY": "${RC_APP_SECRET:?}",
      "POSTGRES_DB": "adc_rc_demo",
      "POSTGRES_USER": "adc_rc_owner",
      "POSTGRES_PASSWORD": "${RC_DB_PASSWORD:?}",
      "DB_HOST": "db",
      "DB_PORT": "5432",
      "ADC_READ_ONLY": "${RC_READ_ONLY:-0}",
      "AI_MODE": "demo",
      "AI_API_KEY": "",
      "OPENAI_API_KEY": "",
      "ADC_OPERATIONS_INSTANCE": "${RC_PROJECT:?}",
      "ADC_SMS_PROVIDER": "${RC_SMS_PROVIDER:-disabled}",
      "ADC_TEACHER_TEST_MODE": "${RC_TEACHER_TEST_MODE:-0}",
      "ADC_PATIENT_AUTH_MODE": "${RC_PATIENT_AUTH_MODE:-demo}",
      "ADC_PATIENT_IDENTITY_PROVIDER": "${RC_PATIENT_IDENTITY_PROVIDER:-disabled}",
      "ADC_WECHAT_MINI_APP_ID": "${RC_WECHAT_MINI_APP_ID:-}",
      "ADC_WECHAT_MINI_APP_SECRET": "${RC_WECHAT_MINI_APP_SECRET:-}",
      "ADC_WECHAT_QR_ENV_VERSION": "${RC_WECHAT_QR_ENV_VERSION:-develop}",
      "ADC_WECHAT_PHONE_ENABLED": "0",
      "ADC_CLOUDBASE_ENV_ID": "${RC_CLOUDBASE_ENV_ID:-}",
      "ADC_CLOUDBASE_REGION": "${RC_CLOUDBASE_REGION:-ap-shanghai}",
      "ADC_CLOUDBASE_PUBLISHABLE_KEY": "${RC_CLOUDBASE_PUBLISHABLE_KEY:-}",
      "ADC_SMS_FREE_QUOTA_CONFIRMED": "${RC_SMS_FREE_QUOTA_CONFIRMED:-0}",
      "ADC_SMS_ALLOWED_TEST_PHONES": "${RC_SMS_ALLOWED_TEST_PHONES:-}",
      "ADC_SMS_LIVE_TEST_LIMIT": "${RC_SMS_LIVE_TEST_LIMIT:-10}"
    },
    "networks": [
      "private"
    ]
  },
  "services": {
    "db": {
      "image": "postgres:17",
      "environment": {
        "POSTGRES_DB": "adc_rc_demo",
        "POSTGRES_USER": "adc_rc_owner",
        "POSTGRES_PASSWORD": "${RC_DB_PASSWORD:?}"
      },
      "volumes": [
        "rc_data:/var/lib/postgresql/data"
      ],
      "networks": [
        "private"
      ],
      "healthcheck": {
        "test": [
          "CMD-SHELL",
          "pg_isready -U adc_rc_owner -d adc_rc_demo"
        ],
        "interval": "3s",
        "timeout": "3s",
        "retries": 30
      },
      "logging": {
        "driver": "none"
      },
      "command": [
        "postgres",
        "-c",
        "log_min_error_statement=panic",
        "-c",
        "log_error_verbosity=terse",
        "-c",
        "log_min_messages=panic"
      ]
    },
    "schema": {
      "build": {
        "context": ".",
        "dockerfile": "Dockerfile.production"
      },
      "image": "${RC_PROJECT:?Prepare RC configuration}-app:1.0.0-rc.1",
      "environment": {
        "ADC_RC_SYNTHETIC": "1",
        "ADC_RC_INSTANCE": "${RC_PROJECT:?}",
        "DJANGO_SETTINGS_MODULE": "config.settings.course_demo",
        "DJANGO_SECRET_KEY": "${RC_APP_SECRET:?}",
        "POSTGRES_DB": "adc_rc_demo",
        "POSTGRES_USER": "adc_rc_owner",
        "POSTGRES_PASSWORD": "${RC_DB_PASSWORD:?}",
        "DB_HOST": "db",
        "DB_PORT": "5432",
        "ADC_READ_ONLY": "${RC_READ_ONLY:-0}",
        "AI_MODE": "demo",
        "AI_API_KEY": "",
        "OPENAI_API_KEY": "",
        "ADC_OPERATIONS_INSTANCE": "${RC_PROJECT:?}",
        "ADC_SMS_PROVIDER": "${RC_SMS_PROVIDER:-disabled}",
        "ADC_TEACHER_TEST_MODE": "${RC_TEACHER_TEST_MODE:-0}",
        "ADC_PATIENT_AUTH_MODE": "${RC_PATIENT_AUTH_MODE:-demo}",
        "ADC_PATIENT_IDENTITY_PROVIDER": "${RC_PATIENT_IDENTITY_PROVIDER:-disabled}",
        "ADC_WECHAT_MINI_APP_ID": "${RC_WECHAT_MINI_APP_ID:-}",
        "ADC_WECHAT_MINI_APP_SECRET": "${RC_WECHAT_MINI_APP_SECRET:-}",
        "ADC_WECHAT_QR_ENV_VERSION": "${RC_WECHAT_QR_ENV_VERSION:-develop}",
        "ADC_WECHAT_PHONE_ENABLED": "0",
        "ADC_CLOUDBASE_ENV_ID": "${RC_CLOUDBASE_ENV_ID:-}",
        "ADC_CLOUDBASE_REGION": "${RC_CLOUDBASE_REGION:-ap-shanghai}",
        "ADC_CLOUDBASE_PUBLISHABLE_KEY": "${RC_CLOUDBASE_PUBLISHABLE_KEY:-}",
        "ADC_SMS_FREE_QUOTA_CONFIRMED": "${RC_SMS_FREE_QUOTA_CONFIRMED:-0}",
        "ADC_SMS_ALLOWED_TEST_PHONES": "${RC_SMS_ALLOWED_TEST_PHONES:-}",
        "ADC_SMS_LIVE_TEST_LIMIT": "${RC_SMS_LIVE_TEST_LIMIT:-10}"
      },
      "networks": [
        "private"
      ],
      "depends_on": {
        "db": {
          "condition": "service_healthy"
        }
      },
      "volumes": [
        "rc_static:/app/staticfiles"
      ],
      "command": [
        "sh",
        "-c",
        "python manage.py migrate --noinput && python manage.py collectstatic --noinput && python manage.py check"
      ],
      "restart": "no",
      "logging": {
        "driver": "local",
        "options": {
          "max-size": "10m",
          "max-file": "3",
          "compress": "true"
        }
      }
    },
    "web": {
      "build": {
        "context": ".",
        "dockerfile": "Dockerfile.production"
      },
      "image": "${RC_PROJECT:?Prepare RC configuration}-app:1.0.0-rc.1",
      "environment": {
        "ADC_RC_SYNTHETIC": "1",
        "ADC_RC_INSTANCE": "${RC_PROJECT:?}",
        "DJANGO_SETTINGS_MODULE": "config.settings.course_demo",
        "DJANGO_SECRET_KEY": "${RC_APP_SECRET:?}",
        "POSTGRES_DB": "adc_rc_demo",
        "POSTGRES_USER": "adc_rc_owner",
        "POSTGRES_PASSWORD": "${RC_DB_PASSWORD:?}",
        "DB_HOST": "db",
        "DB_PORT": "5432",
        "ADC_READ_ONLY": "${RC_READ_ONLY:-0}",
        "AI_MODE": "demo",
        "AI_API_KEY": "",
        "OPENAI_API_KEY": "",
        "ADC_OPERATIONS_INSTANCE": "${RC_PROJECT:?}",
        "ADC_SMS_PROVIDER": "${RC_SMS_PROVIDER:-disabled}",
        "ADC_TEACHER_TEST_MODE": "${RC_TEACHER_TEST_MODE:-0}",
        "ADC_PATIENT_AUTH_MODE": "${RC_PATIENT_AUTH_MODE:-demo}",
        "ADC_PATIENT_IDENTITY_PROVIDER": "${RC_PATIENT_IDENTITY_PROVIDER:-disabled}",
        "ADC_WECHAT_MINI_APP_ID": "${RC_WECHAT_MINI_APP_ID:-}",
        "ADC_WECHAT_MINI_APP_SECRET": "${RC_WECHAT_MINI_APP_SECRET:-}",
        "ADC_WECHAT_QR_ENV_VERSION": "${RC_WECHAT_QR_ENV_VERSION:-develop}",
        "ADC_WECHAT_PHONE_ENABLED": "0",
        "ADC_CLOUDBASE_ENV_ID": "${RC_CLOUDBASE_ENV_ID:-}",
        "ADC_CLOUDBASE_REGION": "${RC_CLOUDBASE_REGION:-ap-shanghai}",
        "ADC_CLOUDBASE_PUBLISHABLE_KEY": "${RC_CLOUDBASE_PUBLISHABLE_KEY:-}",
        "ADC_SMS_FREE_QUOTA_CONFIRMED": "${RC_SMS_FREE_QUOTA_CONFIRMED:-0}",
        "ADC_SMS_ALLOWED_TEST_PHONES": "${RC_SMS_ALLOWED_TEST_PHONES:-}",
        "ADC_SMS_LIVE_TEST_LIMIT": "${RC_SMS_LIVE_TEST_LIMIT:-10}",
        "ADC_WECHAT_MINI_APP_SECRET_FILE": "${RC_WECHAT_MINI_APP_SECRET_FILE:-}"
      },
      "networks": [
        "private",
        "loopback"
      ],
      "depends_on": {
        "schema": {
          "condition": "service_completed_successfully"
        }
      },
      "command": [
        "gunicorn",
        "config.wsgi:application",
        "--config",
        "deployment/gunicorn.conf.py"
      ],
      "restart": "on-failure:3",
      "logging": {
        "driver": "local",
        "options": {
          "max-size": "10m",
          "max-file": "3",
          "compress": "true"
        }
      },
      "volumes": [
        "rc_monitor_observation:/app/operations/monitor:ro",
        {
          "type": "bind",
          "source": "./.rc/private/wechat",
          "target": "/run/adc-wechat",
          "read_only": true,
          "bind": {
            "create_host_path": true
          }
        }
      ]
    },
    "notification-worker": {
      "build": {
        "context": ".",
        "dockerfile": "Dockerfile.production"
      },
      "image": "${RC_PROJECT:?Prepare RC configuration}-app:1.0.0-rc.1",
      "environment": {
        "ADC_RC_SYNTHETIC": "1",
        "ADC_RC_INSTANCE": "${RC_PROJECT:?}",
        "DJANGO_SETTINGS_MODULE": "config.settings.course_demo",
        "DJANGO_SECRET_KEY": "${RC_APP_SECRET:?}",
        "POSTGRES_DB": "adc_rc_demo",
        "POSTGRES_USER": "adc_rc_owner",
        "POSTGRES_PASSWORD": "${RC_DB_PASSWORD:?}",
        "DB_HOST": "db",
        "DB_PORT": "5432",
        "ADC_READ_ONLY": "${RC_READ_ONLY:-0}",
        "AI_MODE": "demo",
        "AI_API_KEY": "",
        "OPENAI_API_KEY": "",
        "ADC_OPERATIONS_INSTANCE": "${RC_PROJECT:?}",
        "ADC_SMS_PROVIDER": "${RC_SMS_PROVIDER:-disabled}",
        "ADC_TEACHER_TEST_MODE": "${RC_TEACHER_TEST_MODE:-0}",
        "ADC_PATIENT_AUTH_MODE": "${RC_PATIENT_AUTH_MODE:-demo}",
        "ADC_PATIENT_IDENTITY_PROVIDER": "${RC_PATIENT_IDENTITY_PROVIDER:-disabled}",
        "ADC_WECHAT_MINI_APP_ID": "${RC_WECHAT_MINI_APP_ID:-}",
        "ADC_WECHAT_MINI_APP_SECRET": "${RC_WECHAT_MINI_APP_SECRET:-}",
        "ADC_WECHAT_QR_ENV_VERSION": "${RC_WECHAT_QR_ENV_VERSION:-develop}",
        "ADC_WECHAT_PHONE_ENABLED": "0",
        "ADC_CLOUDBASE_ENV_ID": "${RC_CLOUDBASE_ENV_ID:-}",
        "ADC_CLOUDBASE_REGION": "${RC_CLOUDBASE_REGION:-ap-shanghai}",
        "ADC_CLOUDBASE_PUBLISHABLE_KEY": "${RC_CLOUDBASE_PUBLISHABLE_KEY:-}",
        "ADC_SMS_FREE_QUOTA_CONFIRMED": "${RC_SMS_FREE_QUOTA_CONFIRMED:-0}",
        "ADC_SMS_ALLOWED_TEST_PHONES": "${RC_SMS_ALLOWED_TEST_PHONES:-}",
        "ADC_SMS_LIVE_TEST_LIMIT": "${RC_SMS_LIVE_TEST_LIMIT:-10}"
      },
      "networks": [
        "private"
      ],
      "profiles": [
        "worker"
      ],
      "depends_on": {
        "schema": {
          "condition": "service_completed_successfully"
        }
      },
      "command": [
        "python",
        "scripts/rc_worker.py"
      ],
      "stop_grace_period": "30s",
      "restart": "on-failure:3",
      "logging": {
        "driver": "local",
        "options": {
          "max-size": "10m",
          "max-file": "3",
          "compress": "true"
        }
      },
      "volumes": [
        "rc_worker_observation:/app/operations/worker"
      ]
    },
    "gateway": {
      "image": "nginx:stable-alpine",
      "depends_on": {
        "schema": {
          "condition": "service_completed_successfully"
        },
        "web": {
          "condition": "service_started"
        }
      },
      "ports": [
        "127.0.0.1:${RC_WEB_PORT:-18000}:8080"
      ],
      "volumes": [
        "./deployment/nginx.course.conf:/etc/nginx/conf.d/default.conf:ro",
        "rc_static:/srv/static:ro"
      ],
      "networks": [
        "private",
        "loopback"
      ],
      "restart": "on-failure:3",
      "logging": {
        "driver": "local",
        "options": {
          "max-size": "10m",
          "max-file": "3",
          "compress": "true"
        }
      },
      "entrypoint": [
        "nginx"
      ],
      "command": [
        "-g",
        "daemon off;",
        "-e",
        "/dev/null"
      ]
    },
    "bootstrap": {
      "build": {
        "context": ".",
        "dockerfile": "Dockerfile.production"
      },
      "image": "${RC_PROJECT:?Prepare RC configuration}-app:1.0.0-rc.1",
      "environment": {
        "ADC_RC_SYNTHETIC": "1",
        "ADC_RC_INSTANCE": "${RC_PROJECT:?}",
        "DJANGO_SETTINGS_MODULE": "config.settings.course_demo",
        "DJANGO_SECRET_KEY": "${RC_APP_SECRET:?}",
        "POSTGRES_DB": "adc_rc_demo",
        "POSTGRES_USER": "adc_rc_owner",
        "POSTGRES_PASSWORD": "${RC_DB_PASSWORD:?}",
        "DB_HOST": "db",
        "DB_PORT": "5432",
        "ADC_READ_ONLY": "${RC_READ_ONLY:-0}",
        "AI_MODE": "demo",
        "AI_API_KEY": "",
        "OPENAI_API_KEY": "",
        "ADC_OPERATIONS_INSTANCE": "${RC_PROJECT:?}",
        "ADC_SMS_PROVIDER": "${RC_SMS_PROVIDER:-disabled}",
        "ADC_TEACHER_TEST_MODE": "${RC_TEACHER_TEST_MODE:-0}",
        "ADC_PATIENT_AUTH_MODE": "${RC_PATIENT_AUTH_MODE:-demo}",
        "ADC_PATIENT_IDENTITY_PROVIDER": "${RC_PATIENT_IDENTITY_PROVIDER:-disabled}",
        "ADC_WECHAT_MINI_APP_ID": "${RC_WECHAT_MINI_APP_ID:-}",
        "ADC_WECHAT_MINI_APP_SECRET": "${RC_WECHAT_MINI_APP_SECRET:-}",
        "ADC_WECHAT_QR_ENV_VERSION": "${RC_WECHAT_QR_ENV_VERSION:-develop}",
        "ADC_WECHAT_PHONE_ENABLED": "0",
        "ADC_CLOUDBASE_ENV_ID": "${RC_CLOUDBASE_ENV_ID:-}",
        "ADC_CLOUDBASE_REGION": "${RC_CLOUDBASE_REGION:-ap-shanghai}",
        "ADC_CLOUDBASE_PUBLISHABLE_KEY": "${RC_CLOUDBASE_PUBLISHABLE_KEY:-}",
        "ADC_SMS_FREE_QUOTA_CONFIRMED": "${RC_SMS_FREE_QUOTA_CONFIRMED:-0}",
        "ADC_SMS_ALLOWED_TEST_PHONES": "${RC_SMS_ALLOWED_TEST_PHONES:-}",
        "ADC_SMS_LIVE_TEST_LIMIT": "${RC_SMS_LIVE_TEST_LIMIT:-10}"
      },
      "networks": [
        "private"
      ],
      "command": [
        "python",
        "manage.py",
        "bootstrap_release_demo"
      ],
      "restart": "on-failure:3",
      "logging": {
        "driver": "none"
      },
      "profiles": [
        "maintenance"
      ]
    },
    "operations": {
      "build": {
        "context": ".",
        "dockerfile": "Dockerfile.production"
      },
      "image": "${RC_PROJECT:?Prepare RC configuration}-app:1.0.0-rc.1",
      "environment": {
        "ADC_RC_SYNTHETIC": "1",
        "ADC_RC_INSTANCE": "${RC_PROJECT:?}",
        "DJANGO_SETTINGS_MODULE": "config.settings.course_demo",
        "DJANGO_SECRET_KEY": "${RC_APP_SECRET:?}",
        "POSTGRES_DB": "adc_rc_demo",
        "POSTGRES_USER": "adc_rc_owner",
        "POSTGRES_PASSWORD": "${RC_DB_PASSWORD:?}",
        "DB_HOST": "db",
        "DB_PORT": "5432",
        "ADC_READ_ONLY": "${RC_READ_ONLY:-0}",
        "AI_MODE": "demo",
        "AI_API_KEY": "",
        "OPENAI_API_KEY": "",
        "ADC_OPERATIONS_INSTANCE": "${RC_PROJECT:?}",
        "ADC_SMS_PROVIDER": "${RC_SMS_PROVIDER:-disabled}",
        "ADC_TEACHER_TEST_MODE": "${RC_TEACHER_TEST_MODE:-0}",
        "ADC_PATIENT_AUTH_MODE": "${RC_PATIENT_AUTH_MODE:-demo}",
        "ADC_PATIENT_IDENTITY_PROVIDER": "${RC_PATIENT_IDENTITY_PROVIDER:-disabled}",
        "ADC_WECHAT_MINI_APP_ID": "${RC_WECHAT_MINI_APP_ID:-}",
        "ADC_WECHAT_MINI_APP_SECRET": "${RC_WECHAT_MINI_APP_SECRET:-}",
        "ADC_WECHAT_QR_ENV_VERSION": "${RC_WECHAT_QR_ENV_VERSION:-develop}",
        "ADC_WECHAT_PHONE_ENABLED": "0",
        "ADC_CLOUDBASE_ENV_ID": "${RC_CLOUDBASE_ENV_ID:-}",
        "ADC_CLOUDBASE_REGION": "${RC_CLOUDBASE_REGION:-ap-shanghai}",
        "ADC_CLOUDBASE_PUBLISHABLE_KEY": "${RC_CLOUDBASE_PUBLISHABLE_KEY:-}",
        "ADC_SMS_FREE_QUOTA_CONFIRMED": "${RC_SMS_FREE_QUOTA_CONFIRMED:-0}",
        "ADC_SMS_ALLOWED_TEST_PHONES": "${RC_SMS_ALLOWED_TEST_PHONES:-}",
        "ADC_SMS_LIVE_TEST_LIMIT": "${RC_SMS_LIVE_TEST_LIMIT:-10}"
      },
      "networks": [
        "private"
      ],
      "depends_on": {
        "schema": {
          "condition": "service_completed_successfully"
        }
      },
      "command": [
        "python",
        "manage.py",
        "observe_operations",
        "--watch"
      ],
      "restart": "on-failure:3",
      "logging": {
        "driver": "local",
        "options": {
          "max-size": "10m",
          "max-file": "3",
          "compress": "true"
        }
      },
      "volumes": [
        "rc_worker_observation:/app/operations/worker:ro",
        "rc_monitor_observation:/app/operations/monitor"
      ],
      "stop_grace_period": "20s"
    }
  },
  "volumes": {
    "rc_data": {},
    "rc_static": {},
    "rc_worker_observation": {},
    "rc_monitor_observation": {}
  },
  "networks": {
    "private": {
      "internal": true
    },
    "loopback": {
      "driver": "bridge",
      "driver_opts": {
        "com.docker.network.bridge.host_binding_ipv4": "127.0.0.1"
      }
    }
  }
}
